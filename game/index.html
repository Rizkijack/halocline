<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halocline — a sonar-lit descent</title>
<meta name="description" content="Halocline: pilot a submersible to the trench floor at 2,000 metres. The water hides everything; a sonar ping is your only light.">
<style>
  /* The page is the game: no scrollbars, no chrome, no external font. The canvas fills the
     window and the renderer scales the fixed 1280x720 field into it. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #031014; }
  body { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", monospace; }
  #game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
    background: #031014;
  }
  /* The status line is announced by screen readers and never drawn. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"
        aria-label="Halocline. Pilot a submersible to the trench floor at 2000 metres. A and D steer, W and S dive and climb, E sounds a sonar ping, P pauses, R restarts."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
